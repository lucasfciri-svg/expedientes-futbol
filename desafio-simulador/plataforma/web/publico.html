<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Registro público de bloqueos</title>
<style>body{margin:0;font:14px/1.45 system-ui,sans-serif;background:#f4f6f9;color:#222}header{background:#1f3a5f;color:#fff;padding:14px 18px}
main{max-width:1100px;margin:auto;padding:12px}.wrap{overflow-x:auto;background:#fff;border-radius:10px;box-shadow:0 1px 3px #0002}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:6px 8px;border-bottom:1px solid #eee;text-align:left;white-space:nowrap}
th{background:#e7ecf3}.muted{color:#666}</style></head><body>
<header><b>Registro público de órdenes de bloqueo</b><br><small id="s"></small></header>
<main><p class="muted">Toda orden de bloqueo emitida por la plataforma: qué se bloqueó, quién lo ordenó, en qué proveedor y hasta cuándo. Se actualiza solo.</p>
<div class="wrap"><table><thead><tr><th>Expediente</th><th>Sitio</th><th>Proveedor</th><th>Tipo</th><th>Objetivo</th><th>Juzgado / Juez</th><th>Enviada</th><th>Aplicada</th><th>Vence</th><th>Fin</th><th>Estado</th></tr></thead><tbody id="t"></tbody></table></div>
<h3>Reclamos</h3><div class="wrap"><table><thead><tr><th>Id</th><th>Dominio</th><th>Minuto</th><th>Estado</th></tr></thead><tbody id="r"></tbody></table></div></main>
<script>const e=s=>String(s??'—').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function f(){const d=await (await fetch('/api/publico')).json();document.getElementById('s').textContent=`${d.partido} · minuto ${d.minuto}`;
document.getElementById('t').innerHTML=d.ordenes.map(o=>`<tr><td>${e(o.expediente_id)}</td><td>${e(o.sitio)}</td><td>${e(o.proveedor)}</td><td>${e(o.tipo)}</td><td>${e(o.objetivo)}</td><td>${e(o.juzgado)}<br><span class="muted">${e(o.juez)}</span></td><td>${e(o.enviada_min)}</td><td>${e(o.aplicada_min)}</td><td>${e(o.vence_min)}</td><td>${e(o.finalizada_min)}</td><td>${e(o.estado)}</td></tr>`).join('')||'<tr><td colspan=11 class="muted">Sin órdenes.</td></tr>';
document.getElementById('r').innerHTML=d.reclamos.map(r=>`<tr><td>${e(r.id)}</td><td>${e(r.dominio)}</td><td>${e(r.minuto)}</td><td>${e(r.estado)}</td></tr>`).join('')||'<tr><td colspan=4 class="muted">Sin reclamos.</td></tr>'}
f();setInterval(f,3000)</script></body></html>
